name: Interview review flow pilot verification
on:
  push:
    branches: [codex/sandbox-pilot-verification]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 72ad4039c88bb30c5fddba2f5e214fa7a4443038
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          npm install --global pnpm@10.26.0
          pnpm install --frozen-lockfile
      - name: Check exact source copies and scoped diff
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess,re
          base='00c0b2b031f683dc2b7f9eacff6c6b2a9f91275f'
          cases=[('refactor-41-state-mutation','Refactor41Task.tsx','source.txt'),('refactor-07-memo-toggle','Refactor07Task.tsx','starter/source.txt')]
          for name,file,source in cases:
              root=Path('src/tasks/review')/name
              original=subprocess.check_output(['git','show',base+':'+str(root/source)])
              assert (root/file).read_bytes()==original
              assert (root/'starter'/file).read_bytes()==original
              assert (root/'solution.tsx').is_file()
              assert not (root/'review.md').exists()
              for link in re.findall(r'\]\((\./[^)]+)\)',(root/'task.md').read_text()):
                  assert (root/link).exists(),link
          print('Original snippets preserved byte for byte; starter and task links PASS')
          PY
      - name: Build application without importing interview snippets
        run: pnpm build
      - name: Verify example answers and catalog lint
        run: |
          pnpm exec eslint src/App.tsx src/tasks/index.ts eslint.config.js src/tasks/review/refactor-07-memo-toggle/solution.tsx src/tasks/review/refactor-41-state-mutation/solution.tsx
          pnpm exec tsc --ignoreConfig --strict --noEmit --skipLibCheck --target es2023 --module esnext --moduleResolution bundler --jsx react-jsx src/tasks/review/refactor-07-memo-toggle/solution.tsx src/tasks/review/refactor-41-state-mutation/solution.tsx
      - name: Catalog smoke test
        run: |
          npm install --prefix /tmp/review-browser playwright@1.56.1
          /tmp/review-browser/node_modules/.bin/playwright install chromium
          pnpm preview --host 127.0.0.1 --port 4173 --strictPort >/tmp/review-preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          cat > /tmp/review-smoke.mjs <<'JS'
          import {chromium} from '/tmp/review-browser/node_modules/playwright/index.mjs'
          const browser=await chromium.launch({headless:true})
          try {
            const page=await browser.newPage()
            await page.goto('http://127.0.0.1:4173/')
            const nav=page.getByRole('navigation',{name:'Список заданий'})
            const content=page.locator('.task-content')
            for(const title of ['Рефакторинг 07: Переключатель с memo-кнопкой','Рефакторинг 41: Две кнопки: счётчик и имя']){
              await nav.getByRole('button',{name:title,exact:true}).click()
              await content.getByText('Открой task.md и рабочий файл в редакторе. Для этого упражнения запуск в браузере не требуется.',{exact:true}).waitFor()
              console.log('CATALOG TEXT-ONLY PASS '+title)
            }
            await nav.getByRole('button',{name:'Реализовать компонент с fetch',exact:true}).click()
            await content.getByText('Здесь будет UI задания с загрузкой данных.',{exact:true}).waitFor()
            console.log('Existing browser task PASS')
          }finally{await browser.close()}
          JS
          node /tmp/review-smoke.mjs
      - name: Verify no tracked modifications
        if: always()
        run: git diff --exit-code
