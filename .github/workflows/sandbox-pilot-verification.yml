name: Sandbox timer hook migration verification
on:
  push:
    branches: [codex/sandbox-pilot-verification]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 517be20d6133ae29b5df0208dbaeb0bf3796e593
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          npm install --global pnpm@10.26.0
          pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Lint migrated hooks and registry
        run: pnpm exec eslint src/tasks/index.ts src/tasks/hooks/use-interval src/tasks/hooks/use-countdown
      - name: Check source fidelity and local links
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          base='324eb8c203bbad99d2e13c460bad648c2b1de656'
          cases=[('use-interval','UseIntervalTask'),('use-countdown','UseCountdownTask')]
          for name,comp in cases:
              root=Path('src/tasks/hooks')/name
              file=root/(comp+'.tsx')
              assert file.read_bytes()==(root/'starter'/file.name).read_bytes()
              assert not (root/'active.ts').exists()
              assert not (root/'attempts').exists()
              if (root/'hint.md').exists():
                  assert (root/'hint.md').read_bytes().startswith(subprocess.check_output(['git','show',base+':'+(root/'hint.md').as_posix()]))
              for target in re.findall(r'\]\((\./[^)]+)\)',(root/'task.md').read_text()):
                  assert (root/target).exists(),target
          print('Clean starters, preserved hints, direct links: PASS')
          PY
      - name: Install browser separately
        run: |
          npm install --prefix /tmp/sandbox-browser playwright@1.56.1
          /tmp/sandbox-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Browser verification
        run: |
          pnpm dev --host 127.0.0.1 --port 5173 --strictPort >/tmp/vite.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5173/ >/dev/null && break; sleep 1; done
          cat > /tmp/browser-check.mjs <<'JS'
          import assert from 'node:assert/strict'
          import {readFile,writeFile} from 'node:fs/promises'
          import {execFileSync} from 'node:child_process'
          import {chromium} from '/tmp/sandbox-browser/node_modules/playwright/index.mjs'
          const cases=[
           ['use-interval','UseIntervalTask','useInterval','Интервальный вызов callback'],
           ['use-countdown','UseCountdownTask','useCountdown','Управление обратным отсчётом']
          ]
          const solutions={
           useInterval:"const latest=useRef(callback); useEffect(()=>{latest.current=callback},[callback]); useEffect(()=>{if(delay===null)return; const id=window.setInterval(()=>latest.current(),delay); return ()=>window.clearInterval(id)},[delay])",
           useCountdown:"const {countStart,countStop=0,intervalMs=1000,isIncrement=false}=options; const [count,setCount]=useState(countStart); const [running,setRunning]=useState(false); const start=()=>{if(count!==countStop)setRunning(true)}; const stop=()=>setRunning(false); const reset=()=>{setRunning(false);setCount(countStart)}; useEffect(()=>{if(!running||count===countStop)return;const id=window.setInterval(()=>{const next=count+(isIncrement?1:-1);setCount(next);if(next===countStop)setRunning(false)},intervalMs);return ()=>window.clearInterval(id)},[running,count,countStop,intervalMs,isIncrement]);return {count,start,stop,reset}"
          }
          const compile=file=>{
           execFileSync('pnpm',['exec','tsc','--ignoreConfig','--strict','--exactOptionalPropertyTypes','--noEmit','--skipLibCheck','--target','es2023','--module','esnext','--moduleResolution','bundler','--jsx','react-jsx',file],{stdio:'inherit'})
           execFileSync('pnpm',['exec','tsc','-b','--force'],{stdio:'inherit'})
           execFileSync('pnpm',['exec','eslint',file],{stdio:'inherit'})
          }
          const browser=await chromium.launch({headless:true})
          const page=await browser.newPage()
          await page.addInitScript(()=>{
           const timers=new Map()
           const set=window.setInterval.bind(window)
           const clear=window.clearInterval.bind(window)
           window.__sandboxIntervals=timers
           window.setInterval=(handler,delay,...args)=>{
            const id=set(handler,delay,...args)
            if([1000,500,300].includes(delay))timers.set(id,delay)
            return id
           }
           window.clearInterval=id=>{timers.delete(id);return clear(id)}
          })
          const content=page.locator('.task-content')
          const nav=page.getByRole('navigation',{name:'Список заданий'})
          const show=async locator=>locator.waitFor({state:'visible',timeout:15000})
          const select=async name=>nav.getByRole('button',{name,exact:true}).click()
          const click=async name=>content.getByRole('button',{name,exact:true}).click()
          const log=name=>console.log('BROWSER RESULT '+name+' PASS')
          const intervals=()=>page.evaluate(()=>[...window.__sandboxIntervals.entries()])
          const waitTimers=async delays=>page.waitForFunction(delays=>JSON.stringify([...window.__sandboxIntervals.values()].sort())===JSON.stringify([...delays].sort()),delays)
          const readCount=async prefix=>Number((await content.getByText(new RegExp('^'+prefix+': [0-9]+$')).textContent()).split(': ')[1])
          const waitCount=async(prefix,value)=>show(content.getByText(prefix+': '+value,{exact:true}))
          const stable=async(prefix,value,ms)=>{await page.waitForTimeout(ms);assert.equal(await readCount(prefix),value)}
          const originals=new Map()
          try{
           await page.goto('http://127.0.0.1:5173')
           await show(nav)
           await waitTimers([])
           for(const [id,comp,hook,title] of cases){
            await select(title)
            const message=content.getByText('Реализуй '+hook,{exact:true})
            await show(message)
            const file='src/tasks/hooks/'+id+'/'+comp+'.tsx'
            const old=await readFile(file,'utf8')
            originals.set(file,old)
            const imports=hook==='useInterval'?'useEffect,useRef':'useEffect,useState'
            const source='import {'+imports+'} from "react"\n'+old.replace(/  \/\/ Замени обе строки реализацией\.\n  void [^\n]+\n  throw new Error\('[^']+'\)/,'  '+solutions[hook])
            assert.ok(!source.includes("throw new Error('Реализуй"))
            await writeFile(file,source)
            compile(file)
            if(hook==='useInterval'){
             await show(content.getByText(/^Count: \d+$/))
             await click('Пауза')
             await waitTimers([])
             const paused=await readCount('Count')
             await stable('Count',paused,1200)
             await click('Продолжить')
             await waitTimers([1000])
             const initial=(await intervals())[0][0]
             await waitCount('Count',paused+2)
             assert.equal((await intervals())[0][0],initial,'callback changes must not recreate interval')
             await click('Изменить интервал')
             await show(content.getByText('Интервал: 500 мс',{exact:true}))
             await waitTimers([500])
             assert.notEqual((await intervals())[0][0],initial)
             const fast=await readCount('Count')
             await waitCount('Count',fast+2)
             await click('Изменить интервал')
             await waitTimers([1000])
             await click('Пауза')
             await waitTimers([])
             await click('Продолжить')
             await waitTimers([1000])
             await select('Реализовать компонент с fetch')
             await show(content.getByText('Здесь будет UI задания с загрузкой данных.',{exact:true}))
             await waitTimers([])
             log('use-interval callback freshness, cadence, delay, pause and unmount cleanup')
            }else{
             await waitCount('Countdown',10)
             await waitTimers([])
             await stable('Countdown',10,1100)
             await click('Start')
             await waitTimers([1000])
             const first=(await intervals())[0][0]
             await click('Start')
             assert.equal((await intervals())[0][0],first)
             await waitCount('Countdown',9)
             await click('Stop')
             await waitTimers([])
             const stopped=await readCount('Countdown')
             await stable('Countdown',stopped,1100)
             await click('Start')
             await waitCount('Countdown',stopped-1)
             await click('Reset')
             await waitCount('Countdown',10)
             await waitTimers([])
             await stable('Countdown',10,1100)
             await click('Start')
             await waitCount('Countdown',0)
             await waitTimers([])
             await click('Start')
             await stable('Countdown',0,1100)
             await waitTimers([])
             const increasing=source.replace('useCountdown({countStart: 10})','useCountdown({countStart: 2, countStop: 5, intervalMs: 300, isIncrement: true})')
             assert.notEqual(source,increasing)
             await writeFile(file,increasing)
             compile(file)
             await page.reload()
             await show(nav)
             await select(title)
             await waitCount('Countdown',2)
             await click('Start')
             await waitTimers([300])
             await waitCount('Countdown',3)
             await waitCount('Countdown',5)
             await waitTimers([])
             await stable('Countdown',5,500)
             await click('Reset')
             await waitCount('Countdown',2)
             await click('Start')
             await waitTimers([300])
             await select('Реализовать компонент с fetch')
             await show(content.getByText('Здесь будет UI задания с загрузкой данных.',{exact:true}))
             await waitTimers([])
             log('use-countdown pause/resume, reset, both directions, boundary and unmount cleanup')
            }
            await writeFile(file,old)
            await select(title)
            await show(message)
            log(id+' restored starter')
           }
           await select('Реализовать компонент с fetch')
           await show(content.getByText('Здесь будет UI задания с загрузкой данных.',{exact:true}))
           log('navigation from failed hook to unrelated task')
          }finally{
           for(const [file,source] of originals)await writeFile(file,source)
           await browser.close()
          }
          JS
          node /tmp/browser-check.mjs
      - name: Verify restored files
        if: always()
        run: |
          git diff --exit-code
          cat /tmp/vite.log || true
