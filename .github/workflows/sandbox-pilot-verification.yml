name: Sandbox ref hook migration verification
on:
  push:
    branches: [codex/sandbox-pilot-verification]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d0e9ac3f902d9939db5b95ec0b7b33c2e8908a11
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          npm install --global pnpm@10.26.0
          pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Lint migrated hooks and registry
        run: pnpm exec eslint src/tasks/index.ts src/tasks/hooks/use-focus src/tasks/hooks/use-latest src/tasks/hooks/use-hover
      - name: Check source fidelity and local links
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          base='54aa06f6a265741259d5c7dd241874f3e4393fea'
          cases=[('use-focus','UseFocusTask'),('use-latest','UseLatestTask'),('use-hover','UseHoverTask')]
          for name,comp in cases:
              root=Path('src/tasks/hooks')/name
              file=root/(comp+'.tsx')
              assert file.read_bytes()==(root/'starter'/file.name).read_bytes()
              assert not (root/'active.ts').exists()
              assert not (root/'attempts').exists()
              if (root/'hint.md').exists():
                  assert (root/'hint.md').read_bytes().startswith(subprocess.check_output(['git','show',base+':'+(root/'hint.md').as_posix()]))
              for target in re.findall(r'\]\((\./[^)]+)\)',(root/'task.md').read_text()):
                  assert (root/target).exists(),target
          print('Clean starters, preserved hints, direct links: PASS')
          PY
      - name: Install browser separately
        run: |
          npm install --prefix /tmp/sandbox-browser playwright@1.56.1
          /tmp/sandbox-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Browser verification
        run: |
          pnpm dev --host 127.0.0.1 --port 5173 --strictPort >/tmp/vite.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5173/ >/dev/null && break; sleep 1; done
          cat > /tmp/browser-check.mjs <<'JS'
          import assert from 'node:assert/strict'
          import {readFile,writeFile} from 'node:fs/promises'
          import {execFileSync} from 'node:child_process'
          import {chromium} from '/tmp/sandbox-browser/node_modules/playwright/index.mjs'
          
          const cases=[
           ['use-focus','UseFocusTask','useFocus','Программная установка фокуса'],
           ['use-latest','UseLatestTask','useLatest','Ref с актуальным значением'],
           ['use-hover','UseHoverTask','useHover','Отслеживание наведения']
          ]
          const solutions={
           useFocus:"const ref=useRef<T>(null); const focus=useCallback(()=>ref.current?.focus(),[]); return [ref,focus]",
           useLatest:"const ref=useRef(value); useLayoutEffect(()=>{ref.current=value},[value]); return ref",
           useHover:"const [hovered,setHovered]=useState(false); const ref=useCallback((node:T|null)=>{if(!node)return; const enter=()=>setHovered(true);const leave=()=>setHovered(false);node.addEventListener('mouseenter',enter);node.addEventListener('mouseleave',leave);return ()=>{node.removeEventListener('mouseenter',enter);node.removeEventListener('mouseleave',leave);setHovered(false)}},[]);return [ref,hovered]"
          }
          const imports={useFocus:"useRef,useCallback,useState",useLatest:"useRef,useLayoutEffect",useHover:"useState,useCallback"}
          const compile=file=>{
           execFileSync('pnpm',['exec','tsc','--ignoreConfig','--strict','--exactOptionalPropertyTypes','--noEmit','--skipLibCheck','--target','es2023','--module','esnext','--moduleResolution','bundler','--jsx','react-jsx',file],{stdio:'inherit'})
           execFileSync('pnpm',['exec','tsc','-b','--force'],{stdio:'inherit'})
           execFileSync('pnpm',['exec','eslint',file],{stdio:'inherit'})
          }
          const browser=await chromium.launch({headless:true})
          const page=await browser.newPage()
          const errors=[]
          page.on('pageerror',error=>errors.push(error.message))
          const content=page.locator('.task-content')
          const nav=page.getByRole('navigation',{name:'Список заданий'})
          const originals=new Map()
          const show=async locator=>locator.waitFor({state:'visible',timeout:15000})
          const select=async name=>nav.getByRole('button',{name,exact:true}).click()
          const click=async name=>content.getByRole('button',{name,exact:true}).click()
          const log=name=>console.log('BROWSER RESULT '+name+' PASS')
          try{
           await page.goto('http://127.0.0.1:5173')
           await show(nav)
           for(const [id,comp,hook,title] of cases){
            await select(title)
            const message=content.getByText('Реализуй '+hook,{exact:true})
            await show(message)
            const file='src/tasks/hooks/'+id+'/'+comp+'.tsx'
            const old=await readFile(file,'utf8')
            originals.set(file,old)
            let source='import {'+imports[hook]+'} from "react"\n'+old.replace("throw new Error('Реализуй "+hook+"')",solutions[hook])
            assert.notEqual(source,old)
            if(hook==='useFocus'){
             source=source.replace("  const [ref, focus] = useFocus<HTMLInputElement>()","  const [ref, focus] = useFocus<HTMLInputElement>()\n  const [visible,setVisible]=useState(true)")
               .replace('<input ref={ref} placeholder="Поле для фокуса" />','{visible && <input ref={ref} placeholder="Поле для фокуса" />}\n      <button type="button" onClick={()=>setVisible(v=>!v)}>Toggle target</button>')
            }else if(hook==='useHover'){
             source=source.replace("  const [ref, hovered] = useHover<HTMLDivElement>()","  const [ref, hovered] = useHover<HTMLDivElement>()\n  const [visible,setVisible]=useState(true)")
               .replace('<div ref={ref} tabIndex={0}>','<button type="button" onClick={()=>setVisible(v=>!v)}>Toggle target</button>\n      <output>{hovered ? "active" : "inactive"}</output>\n      {visible && <div ref={ref} tabIndex={0}>')
               .replace("{hovered ? 'Hovered' : 'Not hovered'}\n      </div>","{hovered ? 'Hovered' : 'Not hovered'}\n      </div>}")
            }
            await writeFile(file,source)
            compile(file)
            if(hook==='useFocus'){
             const input=content.getByPlaceholder('Поле для фокуса')
             await show(input)
             const n=errors.length
             await click('Установить фокус')
             assert.equal(await input.evaluate(el=>document.activeElement===el),true)
             await click('Toggle target')
             await input.waitFor({state:'detached'})
             await click('Установить фокус')
             assert.equal(errors.length,n)
             await click('Toggle target')
             await show(input)
             await click('Установить фокус')
             assert.equal(await input.evaluate(el=>document.activeElement===el),true)
            }else if(hook==='useLatest'){
             const input=content.getByPlaceholder('Введите текст')
             await show(input)
             await input.fill('abc')
             await show(content.getByText('Первая версия: abc',{exact:true}))
             await click('Обновить callback')
             await input.fill('def')
             await show(content.getByText('Новая версия: def',{exact:true}))
             await input.fill('ghi')
             await show(content.getByText('Новая версия: ghi',{exact:true}))
            }else{
             const target=content.locator('div[tabindex="0"]')
             await show(target)
             await page.mouse.move(0,0)
             await show(content.getByText('Not hovered',{exact:true}))
             await target.hover()
             await show(content.getByText('Hovered',{exact:true}))
             await page.mouse.move(0,0)
             await show(content.getByText('Not hovered',{exact:true}))
             await target.hover()
             await show(content.getByText('Hovered',{exact:true}))
             const detached=await target.elementHandle()
             assert.ok(detached)
             // Trigger the button without moving the mouse away, so no mouseleave can hide a cleanup bug.
             await content.getByRole('button',{name:'Toggle target'}).evaluate(el=>el.click())
             await target.waitFor({state:'detached'})
             await show(content.getByText('inactive',{exact:true}))
             await detached.evaluate(el=>el.dispatchEvent(new MouseEvent('mouseenter')))
             await page.waitForTimeout(100)
             await show(content.getByText('inactive',{exact:true}))
             await page.mouse.move(0,0)
             await click('Toggle target')
             await show(target)
             await target.hover()
             await show(content.getByText('Hovered',{exact:true}))
             await page.mouse.move(0,0)
             await show(content.getByText('Not hovered',{exact:true}))
            }
            log(id+' strict/project compilation, solution ESLint and behavior')
            await writeFile(file,old)
            await show(message)
            log(id+' restored starter')
           }
           await select('Реализовать компонент с fetch')
           await show(content.getByText('Здесь будет UI задания с загрузкой данных.',{exact:true}))
           log('navigation from failed hook to unrelated task')
          }finally{
           for(const [file,source] of originals)await writeFile(file,source)
           await browser.close()
          }
          JS
          node /tmp/browser-check.mjs
      - name: Verify restored files
        if: always()
        run: |
          git diff --exit-code
          cat /tmp/vite.log || true
