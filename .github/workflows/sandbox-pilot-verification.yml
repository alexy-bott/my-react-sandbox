name: Sandbox authoring rules and generator verification
on:
  push:
    branches: [codex/sandbox-pilot-verification]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 55059e2da807e67cf26a61d00c7d63ede3fb7bd4
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install project dependencies
        run: |
          npm install --global pnpm@10.26.0
          pnpm install --frozen-lockfile
      - name: Build and lint guide
        run: |
          pnpm build
          pnpm exec eslint src/tasks/00-sandbox-guide/attempts/current/SandboxGuideTask.tsx src/tasks/00-sandbox-guide/starter/SandboxGuideTask.tsx
      - name: Check generator interactively in temporary project
        run: |
          python - <<'PY'
          import os, select, shutil, subprocess, tempfile, time
          from pathlib import Path
          with tempfile.TemporaryDirectory() as tmp:
              root=Path(tmp)
              (root/'scripts').mkdir()
              shutil.copyfile('scripts/create-task.mjs',root/'scripts/create-task.mjs')
              categories=['components','hooks','review','js-basics']
              for category in categories: (root/'src/tasks'/category).mkdir(parents=True)
              def create(answers):
                  p=subprocess.Popen(['node',str(root/'scripts/create-task.mjs')],stdin=subprocess.PIPE,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
                  output=b''
                  try:
                      for answer in answers:
                          end=time.monotonic()+8
                          while b'> ' not in output:
                              remaining=end-time.monotonic()
                              assert remaining>0 and select.select([p.stdout],[],[],remaining)[0], output
                              chunk=os.read(p.stdout.fileno(),4096)
                              assert chunk, output
                              output+=chunk
                          output=output.split(b'> ',1)[1]
                          p.stdin.write((answer+'\n').encode())
                          p.stdin.flush()
                      tail,_=p.communicate(timeout=8)
                      assert p.returncode==0,tail
                  finally:
                      if p.poll() is None: p.kill(); p.wait()
              def check(category,slug,filename):
                  directory=root/'src/tasks'/category/slug
                  assert sorted(x.relative_to(directory).as_posix() for x in directory.rglob('*') if x.is_file())==sorted(['task.md',filename,'starter/'+filename])
                  assert (directory/filename).read_bytes()==(directory/'starter'/filename).read_bytes()==b''
                  assert ('[{}](./{})'.format(filename,filename)) in (directory/'task.md').read_text()
              create(['','Проба','','9','2','task.md','HINT.MD','../outside.ts','CON.ts','UseProbe.tsx'])
              check('hooks','proba','UseProbe.tsx')
              create(['Проба','2','UseProbe.tsx'])
              check('hooks','proba-2','UseProbe.tsx')
              check('hooks','proba','UseProbe.tsx')
              for number,category,filename in [(1,'components','Example.tsx'),(3,'review','review.md'),(4,'js-basics','timer.js')]:
                  create(['Example',str(number),filename])
                  check(category,'example',filename)
              print('GENERATOR PASS: all categories, invalid inputs, collision, root drafts and identical empty starters')
          PY
      - name: Verify archived and protected files
        run: |
          git diff --exit-code 8f6c1216fe9e66478945b8fb4788e902f74dbf95 HEAD -- src/tasks/00-sandbox-guide/attempts/2026-08-20 src/tasks/js-basics/timeout-basics src/tasks/index.ts
          git diff --exit-code
