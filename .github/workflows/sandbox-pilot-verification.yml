name: Sandbox collection hook migration verification
on:
  push:
    branches: [codex/sandbox-pilot-verification]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b55dbcdf210877c1d3c493949d5e61823d8e81bc
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          npm install --global pnpm@10.26.0
          pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Lint migrated hooks and registry
        run: pnpm exec eslint src/tasks/index.ts src/tasks/hooks/use-object src/tasks/hooks/use-array src/tasks/hooks/use-map src/tasks/hooks/state-history
      - name: Check source fidelity and local links
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          base='59bef689650fa65d5ba79ad68e7975f4acfb4106'
          cases=[('use-object','UseObjectTask'),('use-array','UseArrayTask'),('use-map','UseMapTask'),('state-history','StateHistoryTask')]
          for name,comp in cases:
              root=Path('src/tasks/hooks')/name
              file=root/(comp+'.tsx')
              assert file.read_bytes()==(root/'starter'/file.name).read_bytes()
              assert not (root/'active.ts').exists()
              assert not (root/'attempts').exists()
              if (root/'hint.md').exists():
                  assert (root/'hint.md').read_bytes().startswith(subprocess.check_output(['git','show',base+':'+(root/'hint.md').as_posix()]))
              for target in re.findall(r'\]\((\./[^)]+)\)',(root/'task.md').read_text()):
                  assert (root/target).exists(),target
          print('Clean starters, preserved hints, direct links: PASS')
          PY
      - name: Install browser separately
        run: |
          npm install --prefix /tmp/sandbox-browser playwright@1.56.1
          /tmp/sandbox-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Browser verification
        run: |
          pnpm dev --host 127.0.0.1 --port 5173 --strictPort >/tmp/vite.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5173/ >/dev/null && break; sleep 1; done
          cat > /tmp/browser-check.mjs <<'JS'
          import assert from 'node:assert/strict'
          import {readFile, writeFile} from 'node:fs/promises'
          import {execFileSync} from 'node:child_process'
          import {chromium} from '/tmp/sandbox-browser/node_modules/playwright/index.mjs'
          
          const cases=[
            ['use-object','UseObjectTask','useObject','Состояние объекта с объединением'],
            ['use-array','UseArrayTask','useArray','Управление состоянием массива'],
            ['use-map','UseMapTask','useMap','Управление состоянием Map'],
            ['state-history','StateHistoryTask','useStateWithHistory','Состояние с историей изменений']
          ]
          const solutions={
            useObject:"const [value,setValue]=useState(initialValue); return [value,update=>setValue(prev=>({...prev,...(typeof update==='function'?update(prev):update)}))]",
            useArray:"const [value,setValue]=useState(initialValue); return {value,push:item=>setValue(prev=>[...prev,item]),removeByIndex:index=>setValue(prev=>prev.filter((_,i)=>i!==index))}",
            useMap:"const [map,setMap]=useState(()=>new Map(defaultValue)); return {map,set:(key,value)=>setMap(prev=>new Map(prev).set(key,value)),setAll:entries=>setMap(new Map(entries)),remove:key=>setMap(prev=>{const next=new Map(prev);next.delete(key);return next}),reset:()=>setMap(new Map())}",
            useStateWithHistory:"const [snapshot,setSnapshot]=useState({values:[initialState],index:0}); return [snapshot.values[snapshot.index],value=>setSnapshot(prev=>({values:[...prev.values.slice(0,prev.index+1),value],index:prev.index+1})),()=>setSnapshot(prev=>({...prev,index:Math.max(0,prev.index-1)})),()=>setSnapshot(prev=>({...prev,index:Math.min(prev.values.length-1,prev.index+1)})),snapshot.values]"
          }
          const typeChecks=String.raw`
          function useObjectContractChecks() {
            const [empty, setEmpty] = useObject()
            setEmpty({arbitrary: 1})
            // @ts-expect-error an unknown value is not a string
            const text: string = empty.name
            void text
            const [value, setValue] = useObject({name:'valid'})
            const name: string = value.name
            void name
            setValue({name:'next'})
            // @ts-expect-error required initial object must be passed
            useObject<{name:string}>()
            // @ts-expect-error missing required property
            useObject<{name:string}>({})
            // @ts-expect-error incorrect update type
            setValue({name:123})
          }
          void useObjectContractChecks
          `
          const compile=file=>execFileSync('pnpm',['exec','tsc','--ignoreConfig','--strict','--exactOptionalPropertyTypes','--noEmit','--skipLibCheck','--target','es2023','--module','esnext','--moduleResolution','bundler','--jsx','react-jsx',file],{stdio:'inherit'})
          const browser=await chromium.launch({headless:true})
          const page=await browser.newPage()
          const content=page.locator('.task-content')
          const nav=page.getByRole('navigation',{name:'Список заданий'})
          const originals=new Map()
          const show=async locator=>locator.waitFor({state:'visible',timeout:15000})
          const select=async name=>nav.getByRole('button',{name,exact:true}).click()
          const click=async name=>content.getByRole('button',{name,exact:true}).click()
          const log=name=>console.log('BROWSER RESULT '+name+' PASS')
          const waitPre=async (expected)=> {
            await page.waitForFunction(expected=>JSON.stringify(JSON.parse(document.querySelector('.task-content pre').textContent))===JSON.stringify(expected),expected)
          }
          const waitList=async expected=>page.waitForFunction(expected=>JSON.stringify([...document.querySelectorAll('.task-content li')].map(li=>Number(li.firstChild.textContent.trim())))===JSON.stringify(expected),expected)
          const mapText=async (expected)=>page.waitForFunction(expected=>{const text=document.querySelector('.task-content pre')?.textContent??'';return expected.every(s=>text.includes(s))},expected)
          try {
            await page.goto('http://127.0.0.1:5173')
            await show(nav)
            for(const [id,comp,hook,title] of cases){
              await select(title)
              const message=content.getByText('Реализуй '+hook,{exact:true})
              await show(message)
              const file='src/tasks/hooks/'+id+'/'+comp+'.tsx'
              const old=await readFile(file,'utf8')
              originals.set(file,old)
              let solution='import {useState} from "react"\n'+old.replace("throw new Error('Реализуй "+hook+"')",solutions[hook])
              assert.notEqual(solution,old)
              if(hook==='useObject'){
                solution=solution.replace('return (\n    <div className="task-card">','const [empty] = useObject()\n  return (\n    <div className="task-card">\n      <output data-testid="empty">{JSON.stringify(empty)}</output>')+typeChecks
              }
              await writeFile(file,solution)
              compile(file)
              if(hook==='useObject'){
                await waitPre({a:1,b:2})
                assert.equal(await content.getByTestId('empty').textContent(),'{}')
                await click('Increase a')
                await waitPre({a:2,b:2})
                await click('Increase b')
                await waitPre({a:2,b:3})
                await click('Add c')
                await waitPre({a:2,b:3,c:3})
              } else if(hook==='useArray'){
                await waitList([1,2,3])
                await click('Добавить')
                await waitList([1,2,3,4])
                await content.getByRole('button',{name:'Удалить',exact:true}).nth(1).click()
                await waitList([1,3,4])
                await click('Добавить')
                await waitList([1,3,4,4])
                await content.getByRole('button',{name:'Удалить',exact:true}).first().click()
                await waitList([3,4,4])
                await content.getByRole('button',{name:'Удалить',exact:true}).last().click()
                await waitList([3,4])
              } else if(hook==='useMap'){
                await mapText(['key: 🆕'])
                await click('Add')
                await mapText(['key: 🆕','📦'])
                await click('Set new data')
                await mapText(['hello: 👋','data: 📦'])
                const text=await content.locator('pre').textContent()
                assert.ok(!text.includes('key: 🆕'))
                assert.equal((text.match(/:/g)||[]).length,2)
                await click('Remove "hello"')
                await mapText(['data: 📦'])
                assert.ok(!(await content.locator('pre').textContent()).includes('hello:'))
                assert.ok(await content.getByRole('button',{name:'Remove "hello"'}).isDisabled())
                await click('Reset')
                await page.waitForFunction(()=>!document.querySelector('.task-content pre').textContent.includes(':'))
                const mapSolution=solution.replace("useMap<string, string>([['key', '🆕']])","useMap<string, string>(new Map([['key', '🆕']]))")
                assert.notEqual(mapSolution,solution)
                await writeFile(file,mapSolution)
                await page.reload()
                await show(nav)
                await select(title)
                await mapText(['key: 🆕'])
              } else {
                await show(content.getByText('Current: first',{exact:true}))
                for(const [label,value] of [['Set second','second'],['Set third','third'],['Back','second'],['Back','first'],['Forward','second'],['Forward','third']]){
                  await click(label)
                  await show(content.getByText('Current: '+value,{exact:true}))
                }
                await show(content.getByText('History: first → second → third',{exact:true}))
              }
              log(id+' strict compile and full consumer scenarios')
              await writeFile(file,old)
              await show(message)
              log(id+' restored starter')
            }
            await select('Реализовать компонент с fetch')
            await show(content.getByText('Здесь будет UI задания с загрузкой данных.',{exact:true}))
            log('navigation from failed hook to unrelated task')
          } finally {
            for(const [file,source] of originals)await writeFile(file,source)
            await browser.close()
          }
          JS
          node /tmp/browser-check.mjs
      - name: Verify restored files
        if: always()
        run: |
          git diff --exit-code
          cat /tmp/vite.log || true
